name: Build and Test

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-slim
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.4
      - run: ./build-and-test.sh
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          detailed_summary: true
